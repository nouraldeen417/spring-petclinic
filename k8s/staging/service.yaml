# =============================================================================
# Stable address for the staging pods. Applied by the pipeline (deployToK8s).
# Same shape as dev, only the namespace differs. The smoke test reaches it as
#   petclinic.petclinic-staging.svc.cluster.local (port 80)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: petclinic-staging
  labels:
    app: petclinic
spec:
  type: ClusterIP
  selector:
    app: petclinic
  ports:
    - name: http
      port: 80
      targetPort: 8080